# The operators stage of `make deploy-k8s` with the session's values (the ESO
# ServiceAccount's identity). The session component attaches to a whole
# build, so the stage is its own kustomization.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../operators

components:
  - ../../session
