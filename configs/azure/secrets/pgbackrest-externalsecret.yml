# pgBackRest azure.conf Secret — materialized by ESO from Key Vault
# Builds the K8s Secret that PGO mounts into pgBackRest (nbody-db-pgbackrest-
# secret). The account+key live in Key Vault (set by init-secrets.sh from the
# storage account). ESO templates them into the pgBackRest shared-key config.
# No account/key ever lands in git.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbackrest-azure
  namespace: nbody
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv
    kind: ClusterSecretStore
  target:
    name: nbody-db-pgbackrest-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        azure.conf: |
          [global]
          repo1-azure-account={{ .account }}
          repo1-azure-key={{ .key }}
          repo1-azure-key-type=shared
  data:
    - secretKey: account
      remoteRef:
        key: nbody-pgbackrest-account
    - secretKey: key
      remoteRef:
        key: nbody-pgbackrest-key
