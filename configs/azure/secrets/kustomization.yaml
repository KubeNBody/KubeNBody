# secrets — ExternalSecrets retargeted to the Azure Key Vault store
# Inherits the 5 app ExternalSecrets from base/secrets and points their store
# to "azure-kv". Adds a 6th: the pgBackRest azure.conf Secret, built by ESO from
# Key Vault (account+key → shared-key config), replacing the base's Secret.
# remoteRef keys are unchanged — same names used as Key Vault secret names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/secrets
  - pgbackrest-externalsecret.yml

patches:
  - target:
      kind: ExternalSecret
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: azure-kv
