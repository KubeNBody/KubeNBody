apiVersion: v1
kind: Service
metadata:
  name: lgtm-internal
  labels:
    app: lgtm
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: prometheus
      port: 9090
      targetPort: 9090
    - name: loki
      port: 3100
      targetPort: 3100
  selector:
    app: lgtm
