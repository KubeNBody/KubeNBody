# NVIDIA device plugin DaemonSet, for clusters that install the GPU driver but
# not the device plugin (AKS, EKS). GKE installs its own.
# Advertises nvidia.com/gpu on GPU nodes. Runs ONLY on GPU nodes (nodeSelector
# accelerator=nvidia) and tolerates the GPU pool taint (nvidia.com/gpu=present).
# Adapted from NVIDIA's k8s-device-plugin static manifest (Apache-2.0), image and
# version as in the AKS GPU documentation.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin-daemonset
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: nvidia-device-plugin-ds
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: nvidia-device-plugin-ds
    spec:
      priorityClassName: system-node-critical
      # Only schedule on GPU nodes.
      nodeSelector:
        accelerator: nvidia
      # Tolerate the GPU pool taint set by the AKS module (nvidia.com/gpu=present:NoSchedule).
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - image: nvcr.io/nvidia/k8s-device-plugin:v0.18.0
          name: nvidia-device-plugin-ctr
          env:
            - name: FAIL_ON_INIT_ERROR
              value: "false"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
