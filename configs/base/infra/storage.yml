# Persistent Volume Claims (GKE Dynamic Provisioning)
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-volume
spec:
  storageClassName: balanced
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 300Gi   # matches the live volume (expanded in place). A PVC cannot shrink
