---
# API secrets: the JWT signing key and the dashboard user's password. The
# development defaults in the code are public, and the API refuses to start in
# a cluster without these (auth.check_production_secrets).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
  namespace: nbody
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: cluster-secret-store
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: nbody-jwt-secret-key
    - secretKey: DEFAULT_USER_PASSWORD
      remoteRef:
        key: nbody-default-user-password
