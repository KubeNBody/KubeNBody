apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - eso-serviceaccount.yml

helmGlobals:
  chartHome: charts

helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: "0.9.9"
    releaseName: external-secrets
    namespace: external-secrets
    valuesInline:
      serviceAccount:
        create: false
        name: external-secrets
      installCRDs: true

  - name: pgo
    releaseName: pgo
    includeCRDs: true
