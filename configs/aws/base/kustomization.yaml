# The namespaces, and the `ssd` and `balanced` StorageClasses on EBS CSI.
# WaitForFirstConsumer matters with multi-AZ system nodes: the volume is
# created in the AZ of the node the pod lands on.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/base
  - storage-classes.yml
