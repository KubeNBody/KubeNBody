# secrets — ExternalSecrets retargeted to the Parameter Store store
# Inherits the app ExternalSecrets from base/secrets and points their store to
# "aws-ps". remoteRef keys are unchanged — the same names are the SSM parameter
# names (infra/aws/modules/params). No pgBackRest secret here: pgBackRest uses
# IRSA (web-id), not static keys.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base/secrets

patches:
  - target:
      kind: ExternalSecret
    patch: |-
      - op: replace
        path: /spec/secretStoreRef/name
        value: aws-ps
