[tool.poetry]
name = "kubenbody"
version = "1.0.0"
description = "Distributed N-body gravitational simulation on Kubernetes"
authors = ["Dariusz R. Augustyn", "Piotr Grzesik", "Łukasz Wyciślik"]
license = "Apache-2.0"
# Not an installable package: the images run src/ with PYTHONPATH (and
# install the dependencies with --no-root).
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"            # numpy 1.26 has no wheels for 3.13

# API framework
fastapi = ">=0.109.0,<1.0"
uvicorn = {version = ">=0.25.0,<1.0", extras = ["standard"]}
python-multipart = ">=0.0.6,<1.0"

# Database
peewee = ">=3.17.0,<4.0"
peewee-migrate = ">=1.12.0,<2.0"
psycopg2-binary = ">=2.9.0,<3.0"

# Message queue
pika = ">=1.3.0,<2.0"

# Object storage (S3/MinIO)
boto3 = ">=1.28.0,<2.0"
botocore = ">=1.31.0,<2.0"
aioboto3 = ">=11.0.0,<14.0"

# Data validation
pydantic = ">=2.0.0,<3.0"
pydantic-settings = ">=2.0.0,<3.0"

# Authentication
python-jose = {version = ">=3.3.0,<4.0", extras = ["cryptography"]}
bcrypt = ">=4.0.1,<5.0"

# Physics / numerics
numba = ">=0.58.0,<1.0"
numpy = ">=1.24.0,<2.0"

# Redis
redis = ">=5.0.0,<6.0"

# Observability
prometheus-client = ">=0.19.0,<1.0"
python-json-logger = ">=2.0.0,<3.0"
opentelemetry-api = ">=1.20.0,<2.0"
opentelemetry-sdk = ">=1.20.0,<2.0"
opentelemetry-exporter-otlp-proto-grpc = ">=1.20.0,<2.0"
opentelemetry-instrumentation-fastapi = ">=0.41b0"

# Snapshot parsing
pandas = ">=2.0.0,<3.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0,<9.0"
httpx = ">=0.27,<1.0"            # fastapi.testclient
ruff = ">=0.6"

# The scripts outside the images (scripts/), not the services
[tool.poetry.group.tools]
optional = true

[tool.poetry.group.tools.dependencies]
requests = ">=2.31.0,<3.0"

[tool.poetry.group.gpu]
optional = true

[tool.poetry.group.gpu.dependencies]
pycuda = ">=2024.1"

[tool.ruff]
line-length = 120
extend-exclude = ["web-dashboard"]

[tool.ruff.lint]
# syntax errors and pyflakes (undefined names, unused imports and variables)
select = ["E9", "F"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
