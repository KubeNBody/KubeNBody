name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code
    env:
      NUMBA_CACHE_DIR: /tmp/numba-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      # redis-server for the coordination tests
      - run: sudo apt-get update && sudo apt-get install -y redis-server
      # the dev tools at the versions of poetry.lock
      - run: pip install -r requirements.txt pytest==8.4.2 httpx==0.28.1 ruff==0.17.1 requests
      - run: ruff check .
      - run: pytest -q

  dashboard:
    name: Dashboard type check and tests
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: code/web-dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: code/web-dashboard/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  manifests:
    name: Render ${{ matrix.cloud }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cloud: [gcp, azure, aws]
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize, helm and kubeconform
        run: |
          curl -sSfL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.7.0/kustomize_v5.7.0_linux_amd64.tar.gz | sudo tar -xz -C /usr/local/bin kustomize
          curl -sSfL https://get.helm.sh/helm-v3.16.1-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1 linux-amd64/helm
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
      - run: make -C infra/${{ matrix.cloud }} render

  terraform:
    name: Terraform validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.16.4"
      - name: Validate every root module
        run: |
          for dir in infra/gcp/bootstrap infra/gcp/environments/prod \
                     infra/azure/bootstrap infra/azure/environments/prod \
                     infra/aws/bootstrap infra/aws/environments/prod/base infra/aws/environments/prod/cluster; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  # The images are not published: every deployment builds its own. A release
  # tag checks that all three still build.
  images:
    name: Build images
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, dashboard, manifests, terraform]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # the CUDA base image alone is about 10 GB unpacked
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Build
        run: |
          set -euo pipefail
          build() {  # name context dockerfile [build args]
            docker build -t "$1:ci" -f "$2/$3" "${@:4}" "$2"
          }
          build kubenbody code Dockerfile
          build kubenbody-dashboard code/web-dashboard Dockerfile
          docker image prune -af >/dev/null      # room for the CUDA image
          build kubenbody-gpu code Dockerfile.gpu
